# ~/.tmux.conf on the Mini. tmux keeps terminal sessions running after you disconnect.
# The command key stays at the default: Ctrl+b. To leave a session: Ctrl+b, then d.

set -g mouse on                 # scroll with the trackpad
set -g history-limit 100000     # keep a long scrollback for long Claude sessions
set -s escape-time 10           # no delay on the Esc key (Claude Code uses Esc)
set -g focus-events on
set -g default-terminal "tmux-256color"
set -g window-size latest       # size the window to the device that typed last

# status bar: session name on the left, a reminder of where you are on the right
set -g status-style "bg=#1e40af,fg=#ffffff"
set -g status-left " #S "
set -g status-left-length 30
set -g status-right " on the Mini | Ctrl+b then d to leave "
set -g status-right-length 60
